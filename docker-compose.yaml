# docker-compose.yml
version: '3.8'

services:
  ns2:
    image: prometh1us/ns2.35_nam1.15:latest
    container_name: ns2-simulator
    environment:
      - DISPLAY=${DISPLAY}
      - TERM=xterm-256color
    volumes:
      # X11 for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # X11 authentication
      - /tmp/.Xauthority_docker:/root/.Xauthority:ro
      # Simulation files (optional, for data persistence)
      - ./simulations:/simulations:rw
      # Results directory (optional, for data persistence)
      - ./results:/results:rw
    network_mode: bridge
    stdin_open: true
    tty: true
    working_dir: /simulations
    command: /bin/bash
    # Auto-remove when stopped (like --rm)
    restart: "no"
